{% extends "base.html" %}

{% block title %}會員登入 - 體育賽事旅遊規劃與代訂系統{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
  <h1 class="text-xl font-bold text-slate-900">會員登入</h1>
  <p class="text-sm text-slate-500 mt-1">登入後即可管理您的賽事旅遊架構、報價單與訂票憑證。</p>

  {% if error %}
    <div role="alert" class="mt-4 rounded-xl bg-rose-50 border border-rose-200 px-4 py-3 text-sm text-rose-800">
      {{ error }}
    </div>
  {% endif %}

  <form action="/login" method="post" class="mt-6 space-y-4">
    <div>
      <label for="email" class="block text-sm font-medium text-slate-700 mb-1">電子信箱</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        value="{{ email }}"
        placeholder="demo@example.com"
        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
      />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-slate-700 mb-1">密碼</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        placeholder="請輸入密碼"
        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
      />
    </div>

    <button
      type="submit"
      class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm transition cursor-pointer"
    >
      登入會員帳號
    </button>
  </form>

  <div class="mt-5 rounded-xl bg-sky-50 border border-sky-200 p-4 text-xs text-sky-900">
    <div class="flex items-center justify-between gap-2">
      <div>
        <p class="font-semibold">課程展示用預設會員</p>
        <p class="mt-0.5">信箱：<code class="font-mono">demo@example.com</code> ／ 密碼：<code class="font-mono">demo1234</code></p>
      </div>
      <button
        type="button"
        onclick="document.getElementById('email').value='demo@example.com';document.getElementById('password').value='demo1234';"
        class="shrink-0 px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-medium transition cursor-pointer"
      >
        一鍵填入
      </button>
    </div>
  </div>

  <p class="mt-5 text-center text-sm text-slate-600">
    還沒有帳號嗎？
    <a href="/register" class="text-sky-600 hover:underline font-semibold">前往註冊新會員</a>
  </p>
</div>
{% endblock %}
