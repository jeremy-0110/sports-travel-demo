{% extends "base.html" %}

{% block title %}免費註冊 - 體育賽事旅遊規劃與代訂系統{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
  <h1 class="text-xl font-bold text-slate-900">註冊新會員</h1>
  <p class="text-sm text-slate-500 mt-1">建立帳號以開始規劃北美或歐洲賽事旅遊行程。</p>

  {% if error %}
    <div role="alert" class="mt-4 rounded-xl bg-rose-50 border border-rose-200 px-4 py-3 text-sm text-rose-800">
      {{ error }}
    </div>
  {% endif %}

  <form action="/register" method="post" class="mt-6 space-y-4">
    <div>
      <label for="full_name" class="block text-sm font-medium text-slate-700 mb-1">姓名</label>
      <input
        id="full_name"
        name="full_name"
        type="text"
        required
        value="{{ form_data.get('full_name', '') }}"
        placeholder="例如：王大明"
        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
      />
    </div>

    <div>
      <label for="email" class="block text-sm font-medium text-slate-700 mb-1">電子信箱</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        value="{{ form_data.get('email', '') }}"
        placeholder="member@example.com"
        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
      />
    </div>

    <div>
      <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">聯絡電話（選填）</label>
      <input
        id="phone"
        name="phone"
        type="text"
        value="{{ form_data.get('phone', '') }}"
        placeholder="0912-345-678"
        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
      />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-slate-700 mb-1">密碼（至少 6 個字元）</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        minlength="6"
        placeholder="請設定登入密碼"
        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
      />
    </div>

    <button
      type="submit"
      class="w-full py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-semibold text-sm transition cursor-pointer"
    >
      完成註冊並登入
    </button>
  </form>

  <p class="mt-5 text-center text-sm text-slate-600">
    已經有帳號了？
    <a href="/login" class="text-sky-600 hover:underline font-semibold">返回會員登入</a>
  </p>
</div>
{% endblock %}
